# Backstop for vulnerabilities Dependabot cannot open a PR for.
#
# Dependabot only bumps packages it can edit directly. A vulnerable *transitive*
# dependency that is pinned through `pnpm.overrides` (or that no parent package
# has released a fix for) produces an alert with no PR attached, which is how
# such alerts sit unnoticed. This job audits the lockfile on a schedule and
# files a GitHub issue so the alert lands somewhere a human looks.

name: Security Audit

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit lockfile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.25.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"

      # `pnpm audit` resolves against pnpm-lock.yaml, so no install is needed.
      - name: Run pnpm audit
        id: audit
        run: |
          set +e
          pnpm audit --audit-level=high 2>&1 | tee audit.txt
          audit_status=${PIPESTATUS[0]}
          # `pnpm audit` also exits non-zero on infrastructure failures (registry
          # down, network error). Filing a "vulnerabilities found" issue for those
          # trains people to ignore the issue, which defeats the backstop. Only
          # report when the output actually names advisories.
          if [ "$audit_status" != "0" ] && ! grep -q "vulnerabilities found" audit.txt; then
            echo "audit exited $audit_status but reported no advisories - treating as infra failure"
            audit_status=0
          fi
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Security: high/critical advisories with no Dependabot PR"
          # Passed through env rather than interpolated into the script body:
          # `${{ }}` is substituted before bash parses the line, so a branch name
          # containing shell metacharacters would execute. Repo-controlled values
          # (server_url, repository, run_id) are safe to interpolate directly.
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          {
            echo "\`pnpm audit\` found high or critical advisories on \`$REF_NAME\`."
            echo
            echo "These are likely transitive dependencies Dependabot cannot bump on its own."
            echo "Fix by raising the floor in \`pnpm.overrides\` in \`package.json\`, then running \`pnpm install\`."
            echo
            echo "<details><summary>audit output</summary>"
            echo
            echo '```'
            cat audit.txt
            echo '```'
            echo
            echo "</details>"
            echo
            echo "_Generated by [security-audit]($RUN_URL)._"
          } > body.md

          # GitHub's `in:title` search is tokenized, not exact, so it can match a
          # different security-labelled issue. Filter to an exact title match.
          existing=$(gh issue list \
            --state open \
            --label security \
            --search "$TITLE in:title" \
            --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            echo "Commented on existing issue #$existing"
          else
            gh issue create \
              --title "$TITLE" \
              --label security \
              --body-file body.md
          fi
